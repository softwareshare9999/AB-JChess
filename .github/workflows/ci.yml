name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android armv8
    # Release workflow already builds Android on main; keep this job for PRs.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK (r27d)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Build Jieqi Android engine (armv8)
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export PATH="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd src
          make -j"$(nproc)" build COMP=ndk ARCH=armv8 EXE=AB-JChess-android-armv8
          make strip COMP=ndk ARCH=armv8 EXE=AB-JChess-android-armv8
          file AB-JChess-android-armv8
          ls -la AB-JChess-android-armv8

      - uses: actions/upload-artifact@v4
        with:
          name: AB-JChess-android-armv8
          path: src/AB-JChess-android-armv8

  linux-test:
    name: Linux AVX2 + UCI smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download NNUE weights
        run: bash .github/scripts/fetch_nnue.sh nnue

      - name: Build native engine
        run: |
          cd src
          make -j"$(nproc)" build ARCH=x86-64-avx2 EXE=AB-JChess-linux-x86-64-avx2
          make strip ARCH=x86-64-avx2 EXE=AB-JChess-linux-x86-64-avx2

      - name: Run engine go depth test
        run: |
          python3 .github/scripts/uci_depth_test.py \
            src/AB-JChess-linux-x86-64-avx2 \
            nnue/abjchess-20260911.nnue
