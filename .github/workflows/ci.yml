name: CI

# Pushes to main and tags are built and smoke-tested by release.yml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-test:
    name: Linux universal + UCI smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download NNUE weights
        run: bash .github/scripts/fetch_nnue.sh nnue

      # build_universal.sh compiles every x86-64 ISA tier into one static
      # executable and picks the best one at run time (isa/dispatch_x86.cpp).
      - name: Build universal engine
        working-directory: abjchess
        run: |
          JOBS="$(nproc)" src/isa/build_universal.sh linux out-linux
          ls -la out-linux/abjchess-linux-x86-64

      - name: Run engine go depth test
        run: |
          python3 .github/scripts/uci_depth_test.py \
            abjchess/out-linux/abjchess-linux-x86-64 \
            "nnue/$NNUE_NAME"

      # Guards the PengfeiChess bug: a FEN dialect the engine refuses used to leave the previous
      # position in place, so the engine answered for the wrong side.
      - name: Run GUI dialect test
        run: |
          python3 .github/scripts/gui_dialects.py \
            abjchess/out-linux/abjchess-linux-x86-64 \
            "nnue/$NNUE_NAME" --depth 3

      - name: Verify bench signature
        run: |
          cd abjchess/out-linux
          cp "../../nnue/$NNUE_NAME" .
          ./abjchess-linux-x86-64 bench | tee bench.txt
          grep -q "Nodes searched: 43125" bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: abjchess-linux-x86-64
          path: abjchess/out-linux/abjchess-linux-x86-64

  windows:
    name: Windows universal (MinGW cross-compile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (POSIX threads)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64

      - name: Build
        working-directory: abjchess
        run: |
          JOBS="$(nproc)" src/isa/build_universal.sh windows out-win
          file out-win/abjchess-windows-x86-64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: abjchess-windows-x86-64
          path: abjchess/out-win/abjchess-windows-x86-64.exe

  macos:
    name: macOS universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: abjchess
        run: |
          src/isa/build_macos.sh out-mac
          lipo -info out-mac/abjchess-macos

      - uses: actions/upload-artifact@v4
        with:
          name: abjchess-macos
          path: abjchess/out-mac/abjchess-macos

  android:
    name: Android universal binaries
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-arm64
            artifact: abjchess-android-arm64-v8a
          - platform: android-armv7
            artifact: abjchess-android-armeabi-v7a
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK (r27c)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        working-directory: abjchess
        run: |
          JOBS="$(nproc)" src/isa/build_universal.sh ${{ matrix.platform }} out-android
          file out-android/${{ matrix.artifact }}
          ls -la out-android/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: abjchess/out-android/${{ matrix.artifact }}
